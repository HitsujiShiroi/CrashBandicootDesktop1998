name: Build All Platforms (Windows, macOS, Linux)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Convert sprite to Windows .ico
        shell: python
        run: |
          from PIL import Image
          img = Image.open("assets/sprites/frame_000.png")
          img.save("app_icon.ico", format="ICO", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "CrashBandicootDesktop1998" `
            --icon "app_icon.ico" `
            --add-data "assets;assets" `
            main.py
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_package/characters | Out-Null
          Copy-Item "dist/CrashBandicootDesktop1998.exe" dist_package/
          if ((Test-Path "characters") -and (Get-ChildItem "characters")) { Copy-Item "characters/*" dist_package/characters/ -Recurse }
          if (Test-Path "README.md") { Copy-Item "README.md" dist_package/ }
          if (Test-Path "readme.md") { Copy-Item "readme.md" dist_package/README.md }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" dist_package/ }
          if (Test-Path "licence.txt") { Copy-Item "licence.txt" dist_package/LICENSE }
          Compress-Archive -Path dist_package/* -DestinationPath CrashBandicootDesktop1998-Windows-v1.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicootDesktop1998-Windows
          path: CrashBandicootDesktop1998-Windows-v1.1.0.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Convert sprite to macOS .icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     assets/sprites/frame_000.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/sprites/frame_000.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/sprites/frame_000.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/sprites/frame_000.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/sprites/frame_000.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/sprites/frame_000.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/sprites/frame_000.png --out icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o app_icon.icns
      - name: Build macOS .app
        run: |
          pyinstaller --noconfirm --windowed \
            --name "CrashBandicootDesktop1998" \
            --icon "app_icon.icns" \
            --osx-bundle-identifier "com.hitsujishiroi.crashmascot1998" \
            --add-data "assets:assets" \
            main.py
      - name: Package macOS ZIP
        run: |
          mkdir -p dist_package/characters
          cp -R "dist/CrashBandicootDesktop1998.app" dist_package/
          if [ -d "characters" ] && [ "$(ls -A characters)" ]; then cp -R characters/* dist_package/characters/; fi
          [ -f "README.md" ] && cp README.md dist_package/
          [ -f "readme.md" ] && cp readme.md dist_package/README.md
          [ -f "LICENSE" ] && cp LICENSE dist_package/
          [ -f "licence.txt" ] && cp licence.txt dist_package/LICENSE
          cd dist_package
          zip -r -y ../CrashBandicootDesktop1998-macOS-v1.1.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicootDesktop1998-macOS
          path: CrashBandicootDesktop1998-macOS-v1.1.0.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "CrashBandicootDesktop1998" \
            --add-data "assets:assets" \
            main.py
      - name: Package Linux TAR.GZ
        run: |
          mkdir -p dist_package/characters
          cp -R dist/CrashBandicootDesktop1998/* dist_package/
          chmod +x dist_package/CrashBandicootDesktop1998
          if [ -d "characters" ] && [ "$(ls -A characters)" ]; then cp -R characters/* dist_package/characters/; fi
          [ -f "README.md" ] && cp README.md dist_package/
          [ -f "readme.md" ] && cp readme.md dist_package/README.md
          [ -f "LICENSE" ] && cp LICENSE dist_package/
          [ -f "licence.txt" ] && cp licence.txt dist_package/LICENSE
          cd dist_package
          tar -czvf ../CrashBandicootDesktop1998-Linux-v1.1.0.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicootDesktop1998-Linux
          path: CrashBandicootDesktop1998-Linux-v1.1.0.tar.gz