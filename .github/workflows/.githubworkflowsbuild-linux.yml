name: Build Linux App

on:
  push:
    branches: [ "linux" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system libraries for PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "CrashBandicootDesktop1998" \
            --add-data "assets:assets" \
            main.py

      - name: Package Linux Release TAR.GZ
        run: |
          mkdir -p dist_package/characters
          cp -R dist/CrashBandicootDesktop1998/* dist_package/
          chmod +x dist_package/CrashBandicootDesktop1998
          if [ -d "characters" ] && [ "$(ls -A characters)" ]; then
            cp -R characters/* dist_package/characters/
          fi
          [ -f "README.md" ] && cp README.md dist_package/
          [ -f "readme.md" ] && cp readme.md dist_package/README.md
          [ -f "LICENSE" ] && cp LICENSE dist_package/
          [ -f "licence.txt" ] && cp licence.txt dist_package/LICENSE
          cd dist_package
          tar -czvf ../CrashBandicootDesktop1998-Linux-v1.0.0.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashBandicootDesktop1998-Linux-v1.0.0
          path: CrashBandicootDesktop1998-Linux-v1.0.0.tar.gz